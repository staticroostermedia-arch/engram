[workflow]
name = "memory_consolidation_loop"
description = "Memory management, ablation, consolidation, and hygiene loop. Prevents bloat, maintains lawfulness and efficiency. Uses forget_old, scar, promote_hot, compression. Governed to avoid critical loss of value."
primary_goal = "goal:memory_hygiene"
max_iterations = 3

[wake]
ritual = "engram-wake-up"
tools = ["mcp_engram_session_start", "mcp_engram_recall"]

[execute]
steps = [
  { name = "audit_manifold", desc = "Run mcp_engram_verify_manifold_integrity, list recent/low-CRS, identify candidates for consolidation/ablation.", subagent = "memory_auditor" },
  { name = "consolidate", desc = "Promote hot, compress traces/tiles into higher-level concepts via update or new remembers. Use NREM-like logic in session_end.", subagent = "consolidator" },
  { name = "ablate", desc = "Scar or forget_old low-value, contradicted, or redundant memories (after checks).", subagent = "ablator" },
  { name = "lawfulness_check", desc = "Post-ablation verify_manifold_integrity + CRS distribution check. Ensure no critical loss.", subagent = "lawfulness_checker" }
]
subvisor = "memory_consolidation"

[trace]
at = ["every step", "ablation decisions"]
tools = ["mcp_engram_quick_trace", "mcp_engram_remember", "mcp_engram_update", "mcp_engram_scar"]

[spatial]
on = []
tools = []

[thought-tiles]
create = { title = "Memory Hygiene Arc", type = "hygiene", goal_context = "goal:memory_hygiene" }
write_results = true

[handoff]
ritual = "engram-session-end"
tools = ["mcp_engram_session_end", "mcp_engram_thought_tile_write_result", "mcp_engram_forget_old"]
prepare_compression = true

[update]
description = "mcp_engram_update for consolidating related memories into stronger concepts. mcp_engram_promote_hot for high-value."
