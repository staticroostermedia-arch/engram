name: Rust Build, Test & Harness (MVP Prep Enhanced)

on:
  push:
    branches: [ "master", "feat/*", "docs/*", "test/*", "fix/*" ]
  pull_request:
    branches: [ "master", "feat/*", "docs/*", "test/*", "fix/*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required gate — ubuntu is fast and matches agent-memory harness environment.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y capnproto
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Clippy
      run: cargo clippy -- -D warnings
    - name: Format check
      run: cargo fmt -- --check

  agent-memory-harness:
    name: MCP agent-memory (marketplace gate)
    runs-on: ubuntu-latest
    env:
      # Headless CI has no CUDA/display — wgpu init aborts (SIGABRT). Force CPU backend at compile time.
      ENGRAM_FORCE_BACKEND: cpu
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y capnproto python3
    - name: Build engram-server (CPU-only for headless harness, no wgpu link)
      run: cargo build -p engram-server --no-default-features --features cpu-only
    - name: MCP smoke test (pre-harness)
      env:
        ENGRAM_FORCE_CPU_BACKEND: "1"
        ENGRAM_DISABLE_SHEAF: "1"
        ENGRAM_KI_DISABLE: "1"
        ENGRAM_NREM_DISABLE: "1"
        ENGRAM_PROFILE: agent
        RUST_BACKTRACE: "1"
      run: |
        set -euo pipefail
        test -x target/debug/engram
        file target/debug/engram
        ldd target/debug/engram || true
        STORE=$(mktemp -d)
        printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
          | timeout 8 target/debug/engram --store "$STORE" mcp 2>smoke-mcp.stderr || {
            echo "::error::MCP smoke test failed — stderr:"
            cat smoke-mcp.stderr
            exit 1
          }
        head -30 smoke-mcp.stderr
        rm -rf "$STORE"
    - name: Run agent-memory harness (required)
      env:
        ENGRAM_FORCE_CPU_BACKEND: "1"
        ENGRAM_DISABLE_SHEAF: "1"
        ENGRAM_KI_DISABLE: "1"
        ENGRAM_NREM_DISABLE: "1"
        ENGRAM_PROFILE: agent
        # RSI Cycle 32: cold ubuntu runners often 5–9s first session_start; keep local SLO at 5s default
        ENGRAM_WAKE_LATENCY_BUDGET_MS: "15000"
        RUST_BACKTRACE: "1"
      run: |
        STABLE_BIN="$(pwd)/target/debug/engram" \
        tools/test-harness/bin/engram-harness.sh --suite agent-memory --timeout 120 || {
          echo "::group::Harness stderr dumps"
          find /tmp -maxdepth 1 -name 'engram-harness-*.stderr.log' -print -exec cat {} \; 2>/dev/null || true
          find tools/test-harness/logs -name '*.stderr.log' -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"
          exit 1
        }
    - name: Upload harness results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-memory-harness-results
        path: tools/test-harness/results/*agent-memory*.json

  proof-harness:
    name: Proof harness (CPU)
    runs-on: ubuntu-latest
    env:
      ENGRAM_FORCE_BACKEND: cpu
      ENGRAM_FORCE_CPU_BACKEND: "1"
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y capnproto
    - name: Build proof harness
      run: cargo build -p engram-proof-harness
    - name: Run proof harness
      run: |
        chmod +x scripts/run-proof-harness.sh
        ./scripts/run-proof-harness.sh | tee proof-harness.log
        grep -q 'PROOF_HARNESS_RESULT=PASS' proof-harness.log
    - name: Upload proof harness log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proof-harness-log
        path: proof-harness.log

