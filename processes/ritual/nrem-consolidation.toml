# agent:engram.ritual.nrem-consolidation

[process]
name = "agent:engram.ritual.nrem-consolidation"
zedos_type = "ritual"
phase_seed = "0xNREM202606SEED..."

[category]
object = "nrem_consolidation"
morphism = "OP_ADD"
sheaf_role = "Hippocampus → neocortex promotion (hot-set high-CRS blocks, goal bias, mass cap)"
h1_handler = "null"

[mcp_tools]
list = ["mcp_engram_promote_hot", "mcp_engram_record_reasoning_trace"]

[requires]
list = ["__system_state__", "ritual:wake_up_anchor"]

[produces]
list = ["ego.leg3", "hot_path_promotion", "trace:*_nrem", "linguistic_bundle_high_crs", "NREM_promoted_linguistic_to_ego.leg3"]

[invariants]
list = ["leg3_binary_vector_isomorphism", "crs_0.74_gate", "hot-swap", "crs_0.85_for_calculus_ops", "fibered_homotopy_coherence_via_fibered_equiv", "NREM_promotion_of_high_crs_linguistic_bundles_to_ego.leg3", "categorical_invariants_class_mixing_rules_enforced"]

[linguistic]
crs_gate = 0.85
homotopy_check = "fibered_equiv"
promotion_target = "ego.leg3"
calculus_ops = ["OP_IS_SYMBOLIC_OF", "OP_GEOMETRIC_PRODUCT"]
scar_on_violation = "class_mixing_number_word_vars"

[timeout_ms]
value = 60000

[notes]
# From roadmap Phase 1: extend NREM for explicit hot-set. Supports subvisor oversight of consolidation for continuity. Aligned to handoff ki_hijacker bakes.
# Phase 5 additive extension (Sub-agent 5): high-CRS linguistic bundles promoted to ego.leg3 (CRS>=0.85 for calculus, homotopy via fibered). Reuses P2 linguistic-calculus.toml + fibered-equivalence.toml patterns (h1/OP_IS_SYMBOLIC_OF/OP_GEOMETRIC_PRODUCT/CRS). Extends scars/lawfulness for categorical invariants (e.g. no number/word var mixing without geometric product). Integrates NREM/ego/CRS/Lyapunov. 3-iter handoff complete. Dogfood to goal:mvp_gap_closure_v1. Tests: wake→calculus→NREM→ego.leg3 survive via bundle + verify healthy.
# Lightweight wiring (smallest viable slice) to goal_sweep for real operation (per Group 1 proposals mFC mapping and explicit "integrate with nrem-consolidation.toml" + "sweep as phased relate/eval by dist in ritual toml"): As part of this NREM consolidation normal flow (after hot-set promotion + goal bias, before/parallel to linguistic promotion), reference/execute the phased steps from process:engram.goal_sweep (processes/process/goal_sweep.toml): 1. far: mcp_engram_search_by_relation (broad high-dist structural context / mFC invariant factors), 2. mid: query_with_momentum + p-momentum bias to compute/reduce dist_to_goal (flexible goal update), 3. near: dist_to_goal (real .leg3 via existing VsaBackend::fetch + op_bind for actual relate/search_by_relation + p-momentum for trajectory cost) + mcp_engram_record_reasoning_trace (prospective futures eval + policy trace in manifold). This declarative reference makes goal_sweep run as part of normal NREM flow via shared ritual/harness context and mcp_tools. ralph_wiggum safe (read-only wiring, no writes to manifold). See GEOMETRIC_MEMORY.md (sheaf gluing, NREM, p/relate/fetch) and proposals doc for mFC justification and full next steps.