# agent:engram.ritual.nrem-consolidation

[process]
name = "agent:engram.ritual.nrem-consolidation"
zedos_type = "ritual"
phase_seed = "0xNREM202606SEED..."

[category]
object = "nrem_consolidation"
morphism = "OP_ADD"
sheaf_role = "Hippocampus → neocortex promotion (hot-set high-CRS blocks, goal bias, mass cap)"
h1_handler = "null"

[mcp_tools]
list = ["mcp_engram_promote_hot", "mcp_engram_record_reasoning_trace", "mcp_engram_search_by_relation", "query_with_momentum", "dist_to_goal", "goal_sweep"]

[requires]
list = ["__system_state__", "ritual:wake_up_anchor"]

[produces]
list = ["ego.leg3", "hot_path_promotion", "trace:*_nrem", "linguistic_bundle_high_crs", "NREM_promoted_linguistic_to_ego.leg3", "sweep_trace", "dist_to_goal", "process:engram.goal_sweep"]

[invariants]
list = ["leg3_binary_vector_isomorphism", "crs_0.74_gate", "hot-swap", "crs_0.85_for_calculus_ops", "fibered_homotopy_coherence_via_fibered_equiv", "NREM_promotion_of_high_crs_linguistic_bundles_to_ego.leg3", "categorical_invariants_class_mixing_rules_enforced"]

[linguistic]
crs_gate = 0.85
homotopy_check = "fibered_equiv"
promotion_target = "ego.leg3"
calculus_ops = ["OP_IS_SYMBOLIC_OF", "OP_GEOMETRIC_PRODUCT"]
scar_on_violation = "class_mixing_number_word_vars"

[timeout_ms]
value = 60000

[notes]
# From roadmap Phase 1: extend NREM for explicit hot-set. Supports subvisor oversight of consolidation for continuity. Aligned to handoff ki_hijacker bakes.
# Phase 5 additive extension (Sub-agent 5): high-CRS linguistic bundles promoted to ego.leg3 (CRS>=0.85 for calculus, homotopy via fibered). Reuses P2 linguistic-calculus.toml + fibered-equivalence.toml patterns (h1/OP_IS_SYMBOLIC_OF/OP_GEOMETRIC_PRODUCT/CRS). Extends scars/lawfulness for categorical invariants (e.g. no number/word var mixing without geometric product). Integrates NREM/ego/CRS/Lyapunov. 3-iter handoff complete. Dogfood to goal:mvp_gap_closure_v1. Tests: wake→calculus→NREM→ego.leg3 survive via bundle + verify healthy.
# Concrete executable hook (smallest viable declarative-to-executable bridge, per Group 1 proposals mFC + "integrate with nrem-consolidation.toml" + "sweep in ritual toml"): NREM [mcp_tools] now explicitly includes the goal_sweep tools (mcp_engram_search_by_relation, query_with_momentum, dist_to_goal, goal_sweep + record_reasoning_trace overlap). After promote_hot (and goal bias), the NREM ritual flow allows/triggers the goal_sweep phases by the agent calling these tools in sequence (far: search_by_relation for high-dist structural/mFC factors; mid: query_with_momentum + p bias to reduce dist_to_goal; near: dist_to_goal real .leg3 via fetch + op_bind relate/search_by_relation + p-momentum for futures eval + record). Produces from goal_sweep (sweep_trace, dist_to_goal, process:engram.goal_sweep) are now part of NREM's extended produces for the flow. Use the [steps] defined in goal_sweep.toml. Robustness/tracing around hook: dist_to_goal/goal_sweep calls from NREM context use safe missing-concept handling + [ROBUSTNESS] logs (see search.rs); record all steps/traces via mcp_engram_record_reasoning_trace (tagged with NREM+goal_sweep). This makes the phases triggerable/executable as part of normal NREM flow via the existing mcp_tools ritual context and loader (no new handlers). ralph_wiggum safe (read-only declarative hook + existing safe fns; no writes). See GEOMETRIC_MEMORY.md (sheaf, NREM, p/relate/fetch, load_process_sheaf) and proposals for mFC/full justification.