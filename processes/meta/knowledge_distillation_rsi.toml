# agent:engram.meta.knowledge-distillation-rsi
# Ultimate memory backend loop: research → lexicon distill → sheaf/temporal glue → verify → ship.
# Complements ai_consciousness_loop + self_improvement_loop. Local-first + secure_context.

[workflow]
