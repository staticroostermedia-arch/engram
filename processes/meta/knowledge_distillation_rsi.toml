[execute]
steps = [
  { name = "rehydrate", desc = "session_start + ack_wake_queue; read handoff + secure_context state", tools = ["mcp_engram_session_start", "mcp_engram_ack_wake_queue"] },
  { name = "observe", desc = "stats + verify_manifold_integrity sample; lawfulness on new lexicon", tools = ["mcp_engram_stats", "mcp_engram_verify_manifold_integrity", "mcp_engram_verify_block_lawfulness"] },
  { name = "research_distill", desc = "Arxiv/web or local Gemma summary → mint_lexicon_word (optional ENGRAM_ENCRYPT_AT_REST) → relate pillars", tools = ["mcp_engram_lexicon_mint_word", "mcp_engram_relate_batch", "mcp_engram_quick_trace"] },
  { name = "sheaf_glue", desc = "relate new atoms to formal_spec:linguistic_reference_frame_v1 + process:engram.ritual.secure-context-provision + ego anchors", tools = ["mcp_engram_relate", "mcp_engram_promote_hot_batch"] },
  { name = "optional_code", desc = "Only if hypothesis needs substrate change: context_for_edit + safe_edit_and_verify; never cloud upload", tools = ["mcp_engram_safe_edit_and_verify"] },
  { name = "verify", desc = "manifold integrity + CRS≥0.74 on new blocks + scar productive failures", tools = ["mcp_engram_verify_manifold_integrity", "mcp_engram_scar"] },
  { name = "ship", desc = "feature branch → PR master → CI → squash merge when green", tools = [] },
  { name = "handoff", desc = "session_end prepare_compression; update docs/rsi_evolution_log.md", tools = ["mcp_engram_session_end"] },
]
subvisor = "consciousness_loop"

[privacy_guardrails]
invariants = [
  "local_only_engram_mcp",
  "no_cloud_codebase_upload",
  "xchacha20poly1305_when_encrypt_at_rest",
  "selective_disclosure_only",
  "audit_secure_provision",
]
ritual = "process:engram.ritual.secure-context-provision"

[mcp_tools]
list = [
  "mcp_engram_session_start",
  "mcp_engram_lexicon_mint_word",
  "mcp_engram_secure_context_provision",
  "mcp_engram_verify_manifold_integrity",
  "mcp_engram_quick_trace",
  "mcp_engram_session_end",
]

[invariants]
list = [
  "unit_hypersphere_vsa",
  "crs_0.74_new_blocks",
  "provlog_merkle_provenance",
  "minimal_context_aabb",
  "trace_research_sources",
  "manifold_health_primary",
]

[timeout_ms]
