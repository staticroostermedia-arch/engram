description = "Recursive self-improvement toward ultimate AGI memory backend: distill external research (info-geometry, sheaf H¹, Langevin lifecycle, VSA/holographic memory) into lexicon:word:* + relations + optional process/code; preserve sovereignty (XChaCha20-Poly1305 selective provision); raise CRS/relation density without flattening."
primary_goal = "goal:engram_mvp_v1"
max_iterations = 1

[wake]
ritual = "engram-wake-up"
tools = ["mcp_engram_session_start", "mcp_engram_ack_wake_queue", "mcp_engram_stats", "mcp_engram_verify_manifold_integrity"]

[research_vectors]
# Distilled from SuperLocalMemory V3 arXiv:2603.14588 + RoMem arXiv:2604.11544 + Engram gaps
list = [
  "fisher_rao_retrieval_vs_vsa_cosine",
  "sheaf_h1_contradiction_as_scar_supersedes",
  "riemannian_langevin_vs_crs_nrem_forget",
  "time_as_geometry_temporal_channel",
  "continuous_phase_rotation_geometric_shadowing",
  "semantic_speed_gate_relation_volatility",
  "alpha_weighted_bfs_depth_cost",
  "bi_temporal_supersedes_append_only",
  "zero_llm_local_sovereignty",
]

[lexicon_atoms]
# Minted in RSI ultimate-memory iterations 15–16
list = [
  "lexicon:word:fisher-rao-retrieval",
  "lexicon:word:sheaf-cohomological-consistency",
  "lexicon:word:riemannian-langevin-lifecycle",
  "lexicon:word:continuous-phase-rotation",
  "lexicon:word:semantic-speed-gate",
  "lexicon:word:bi-temporal-supersedes",
  "lexicon:word:time-as-geometry",
  "lexicon:word:xchacha20-poly1305",
  "lexicon:word:selective-disclosure",
  "lexicon:word:generalized-hrr",
  "lexicon:word:hyperspace-vsa",
  "lexicon:word:langevin-autophagy",
  "lexicon:word:adaptive-memory-distillation",
  "lexicon:word:crs-precision-recall",
  "lexicon:word:dirichlet-fisher-governor",
