[package]
name        = "engram-gpu"
description = "GPU backends for Engram — CUDA LBVH O(log N) K-NN + WebGPU INT8 Poincaré hyperbolic search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default      = ["wgpu-backend"]
# These legacy flags are still accepted but auto-detection via build.rs is the
# preferred path — just `cargo install engram-server` and the best backend is chosen.
cuda-kernels = []   # kept for explicit override: --features cuda-kernels
rocm-kernels = []   # kept for explicit override: --features rocm-kernels
wgpu-backend = ["dep:wgpu", "dep:pollster"]
device_residency = []  # Tier 3: future cuFile / GPUDirect Storage / direct GPU memory residency for items in high_priority_cache (CPU removal from hottest paths)
cpu-only = []  # marker: build engram-server with --no-default-features for headless CI (no wgpu link)

[[example]]
name = "poincare_vs_cosine"
required-features = ["wgpu-backend"]

[dependencies]
engram-core  = { path = "../engram-core", default-features = false }
num-complex  = { workspace = true }
anyhow       = { workspace = true }
tracing      = { workspace = true }
shellexpand  = { workspace = true }
libc         = { workspace = true }
rayon        = { workspace = true }
# wgpu is optional — enabled via wgpu-backend feature (default on). Headless CI uses
# `cargo build -p engram-server --no-default-features` to avoid SIGABRT on runners without GPU.
wgpu     = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }   # sync executor for wgpu init/readback
bytemuck = "1"     # safe &[u32] ↔ &[u8] casts for GPU buffers

[build-dependencies]
# cc is used to compile the CUDA kernels when cuda-kernels feature is enabled
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27.0"
objc = "0.2.7"
