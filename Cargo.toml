[workspace]
resolver = "2"
members = [
    "crates/engram-core",
    "crates/engram-ast",
    "crates/engram-gpu",
    "crates/engram-cli",
    "crates/engram-server",
]

[workspace.package]
version     = "0.7.0-beta.2"
edition     = "2021"
authors     = ["Aric Goodman <StaticRoosterMedia@gmail.com>", "Static Rooster Media <StaticRoosterMedia@gmail.com>"]
license     = "AGPL-3.0-only"
repository  = "https://github.com/staticroostermedia-arch/engram"
homepage    = "https://github.com/staticroostermedia-arch/engram"
description = "Persistent geometric (non-flat) memory for AI agents. 256KB HolographicBlocks, VSA/sheaf, spatial AABB, harness injection at wake, 8-tool lean contract (66 MCP tools tiered). Rituals, CRS lawfulness, session handoff. Rust + MCP. No cloud."
keywords    = ["ai-memory", "geometric-memory", "mcp", "rituals", "spatial-memory", "non-flat", "manifold", "agent-memory", "vector-symbolic-architecture", "holographic-memory", "continuation-bundles", "lawfulness", "geosphere", "subvisor", "sheaf"]
categories  = ["science", "data-structures", "command-line-utilities", "development-tools"]

[workspace.dependencies]
# Core math
num-complex  = { version = "0.4", features = ["serde"] }
blake3       = "1"
bytemuck     = { version = "1", features = ["derive"] }
rayon        = "1"

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Async runtime
tokio        = { version = "1", features = ["full"] }
axum         = "0.7"
tower        = "0.4"
tower-http   = { version = "0.5", features = ["cors", "trace"] }

# Logging
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow  = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# CLI
clap        = { version = "4", features = ["derive", "env"] }
shellexpand = "3"
walkdir     = "2"
libc         = "0.2"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

